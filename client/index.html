<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#262522" />
    <meta name="description" content="[COMPANY NAME] provides precision heating and cooling service for homes and businesses across [PRIMARY SERVICE AREA + SURROUNDING CITIES]." />
    <meta property="og:title" content="[COMPANY NAME] — Precision HVAC Service" />
    <meta property="og:description" content="Heating and cooling service for [CITY, STATE], with clear diagnosis and comfort handled properly." />
    <meta property="og:type" content="website" />
    <title>[COMPANY NAME] — Precision HVAC Service</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" href="/manus-storage/hvac-mark_35461d30.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "HVACBusiness",
        "name": "[COMPANY NAME]",
        "description": "Precision heating and cooling service for homes and businesses.",
        "telephone": "[PHONE NUMBER]",
        "email": "[EMAIL]",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "[CITY]",
          "addressRegion": "[STATE]",
          "streetAddress": "[ADDRESS]"
        },
        "areaServed": "[PRIMARY SERVICE AREA + SURROUNDING CITIES]"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script defer src="%VITE_ANALYTICS_ENDPOINT%/umami" data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>
</html>
